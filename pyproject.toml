[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stt-qubo-core"
version = "0.1.5"
description = "Reusable QUBO core library for API and HPC execution"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "SurfTechTide" }
]
dependencies = [
  "pydantic>=2.11",
  "dimod>=0.12"
]

[project.urls]
Homepage = "https://github.com/pasqualcastellon/qubo-core"
Repository = "https://github.com/pasqualcastellon/qubo-core"
Issues = "https://github.com/pasqualcastellon/qubo-core/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/stt_qubo_core"]
